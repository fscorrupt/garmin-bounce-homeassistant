          action: call-service
          service: button.press
          target:
            entity_id: button.louisa_s_bounce_2_louisa_poll_cloud_data

  # 5. Custom Manual Message Input
  - type: entities
    title: "✍️ Eigene Nachricht an die Uhr"
    show_header_toggle: false
    entities:
      - entity: input_text.garmin_bounce_message
