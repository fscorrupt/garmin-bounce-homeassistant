  - type: horizontal-stack
    cards:
      - type: button
        name: "An Uhr senden"
        icon: mdi:send
        tap_action:
          action: call-service
          service: garmin_bounce.send_message
          service_data:
            target: "child"
            message: "input_text.garmin_bounce_message"

      - type: button
        name: "An Familie senden"
        icon: mdi:account-group
        tap_action:
          action: call-service
          service: garmin_bounce.send_message
          service_data:
            target: "family"
            message: "input_text.garmin_bounce_message"

  # 6. Quick Message Selection
  - type: entities
    title: "⚡ Schnellauswahl Vorlage"
    show_header_toggle: false
    entities:
      - entity: select.louisa_s_bounce_2_louisa_quick_message
        name: "Vorlage senden"

  # 7. Chatverlauf mit Audio Player
  - type: markdown
    title: "💬 Chatverlauf mit der Uhr"
    content: >
      {% set history = state_attr('sensor.louisa_s_bounce_2_louisa_last_message', 'chat_history') %}
      {% if history %}
        {% for m in history[:8] %}
          {% if m.direction == 'incoming' %}
            > 👧 **{{ m.sender }}** ({{ as_timestamp(m.timestamp) | timestamp_custom('%H:%M', true) }}):  
            > {{ m.text }}
            {% if m.is_audio and m.audio_url %}  
